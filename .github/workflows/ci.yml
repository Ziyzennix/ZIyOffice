name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: "Privacy guardrail: manifest permissions"
        run: bash scripts/ci/check-manifest.sh

      - name: "Privacy guardrail: no networking code"
        run: bash scripts/ci/check-no-network-code.sh

      - name: "Privacy guardrail: banned dependencies"
        run: bash scripts/ci/check-dependencies.sh
